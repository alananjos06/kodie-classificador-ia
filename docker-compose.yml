services:
  # API em FastAPI que conversa com a IA
  api:
    build: .
    container_name: classificador-api
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  # n8n: ferramenta de automação que orquestra o fluxo
  n8n:
    image: n8nio/n8n:latest
    container_name: classificador-n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_DIAGNOSTICS_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n   # guarda fluxos e usuário entre reinícios
      - ./n8n:/home/node/fluxos    # deixa o JSON do fluxo visível dentro do container
    depends_on:
      - api
    restart: unless-stopped

volumes:
  n8n_data:
